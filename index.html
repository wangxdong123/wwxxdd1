  <script>
    // ============================================================
    // 核心功能：歌词、搜索、播放
    // ============================================================

    // ========== 工具函数 ==========
    function decodeHTML(html) {
      if (!html) return '';
      const txt = document.createElement("textarea");
      txt.innerHTML = html;
      return txt.value;
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return '00:00';
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function artworkShort2Long(albumpicShort, size = 1080) {
      if (!albumpicShort) return undefined;
      const idx = albumpicShort.indexOf("/");
      return idx !== -1 ? `https://img4.kuwo.cn/star/albumcover/${size}${albumpicShort.slice(idx)}` : undefined;
    }

    function getDefaultCover() {
      const canvas = document.createElement('canvas');
      canvas.width = 100;
      canvas.height = 100;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 100, 100);
      grad.addColorStop(0, '#7c3aed');
      grad.addColorStop(1, '#6d28d9');
      ctx.fillStyle = grad;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(0, 0, 100, 100, 12);
      } else {
        ctx.rect(0, 0, 100, 100);
      }
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = '48px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎵', 50, 52);
      return canvas.toDataURL('image/png');
    }
    const DEFAULT_COVER = getDefaultCover();

    function getProxyUrl(url) {
      const proxyBase = localStorage.getItem('music_cors_proxy') || 'https://jsnzkpg4.pages.dev/';
      const cleanProxy = proxyBase.endsWith('/') ? proxyBase : proxyBase + '/';
      return `${cleanProxy}${url}`;
    }

    // fetch 带超时，防止个别慢请求挂死整批加载
    async function fetchWithTimeout(url, ms = 15000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        return await fetch(url, { signal: ctrl.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    // 榜单匹配结果缓存（localStorage，每天更新）：当天首次打开强制拉取最新榜单，
    // 同一天内重复打开命中缓存秒出、跳过网络匹配；跨天后自动失效重新匹配
    const RANK_CACHE_TTL = 24 * 3600 * 1000; // 24h 兜底
    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function loadRankCache(bangKey) {
      try {
        const raw = localStorage.getItem('music_rank_cache_' + bangKey);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !obj.songs || !Array.isArray(obj.songs) || !obj.songs.length) return null;
        if (obj.day !== todayStr()) return null; // 非当天榜单：过期，强制更新
        if (Date.now() - obj.t > RANK_CACHE_TTL) return null; // 24h 兜底
        return obj;
      } catch (e) { return null; }
    }

    async function searchMusic(query, page, rn = 30) {
      const url = `http://search.kuwo.cn/r.s?client=kt&all=${encodeURIComponent(query)}&pn=${page - 1}&rn=${rn}&uid=2574109560&ver=kwplayer_ar_8.5.4.2&vipver=1&ft=music&cluster=0&strategy=2012&encoding=utf8&rformat=json&vermerge=1&mobi=1`;
      const response = await fetchWithTimeout(getProxyUrl(url));
      let text = await response.text();
      if (text.startsWith('callback(') || text.startsWith('jsonp(')) {
        text = text.substring(text.indexOf('(') + 1, text.lastIndexOf(')'));
      }
      let res;
      try { res = JSON.parse(text); } catch(e) { res = eval('(' + text + ')'); }
      const songs = res.abslist.map(_ => ({
        // 存储纯数字 ID（去掉 MUSIC_ 前缀）
        id: _.MUSICRID.replace("MUSIC_", ""),
        artwork: artworkShort2Long(_.web_albumpic_short, 300),
        thumb: artworkShort2Long(_.web_albumpic_short, 120),
        title: decodeHTML(_.NAME || ""),
        artist: decodeHTML(_.ARTIST || ""),
        album: decodeHTML(_.ALBUM || ""),
      }));
      return { isEnd: (+res.PN + 1) * +res.RN >= +res.TOTAL, data: songs };
    }

    async function findKuwoSong(name, artist) {
      const key = `${name}|${artist}`;
      // 内存缓存：同榜重试、换榜重复歌曲直接命中，避免重复网络请求
      if (kuwoHitCache.has(key)) return kuwoHitCache.get(key);
      const candidates = artist && artist !== '未知歌手' ? [`${name} ${artist}`, name] : [name];
      // 并发发起候选搜索，任一命中即返回（快速路径优先）
      const results = await Promise.allSettled(candidates.map(q => searchMusic(q, 1, 3)));
      let hit = null;
      for (let i = 0; i < results.length; i++) {
        const r = results[i];
        if (r.status === 'fulfilled' && r.value.data.length) { hit = r.value.data[0]; break; }
      }
      kuwoHitCache.set(key, hit);
      if (kuwoHitCache.size > 600) kuwoHitCache.clear(); // 防止无限增长
      return hit;
    }

    async function mapLimit(items, limit, fn) {
      const out = new Array(items.length);
      let i = 0;
      const worker = async () => {
        while (i < items.length) {
          const cur = i++;
          out[cur] = await fn(items[cur]);
        }
      };
      await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
      return out;
    }

    // ========== 【核心修复】歌词获取 - 直接传纯数字 ID ==========
    async function fetchLyrics(songId) {
      // songId 是纯数字，直接拼接
      const url = `http://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=${songId}&httpStatus=1`;
      console.log('📡 请求歌词 URL:', url);
      try {
        const response = await fetchWithTimeout(getProxyUrl(url));
        const res = await response.json();
        console.log('📦 歌词响应:', res);
        const rawList = res.data?.lrclist || [];
        if (rawList.length === 0) {
          console.warn('⚠️ 歌词列表为空');
          return [];
        }
        return rawList.map(line => {
          let time = 0;
          if (typeof line.time === 'string' && line.time.includes(':')) {
            const parts = line.time.split(':');
            if (parts.length === 2) {
              time = parseInt(parts[0]) * 60 + parseFloat(parts[1]);
            }
          } else {
            time = parseFloat(line.time) || 0;
          }
          return {
            time: time,
            text: decodeHTML(line.lineLyric || '')
          };
        }).filter(item => item.text);
      } catch(e) {
        console.error('❌ 加载歌词出错:', e);
        return [];
      }
    }

    // ========== 【核心修复】高清封面 - 直接传纯数字 ID ==========
    async function fetchHighResArtwork(songId) {
      const url = `http://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=${songId}&httpStatus=1`;
      try {
        const response = await fetchWithTimeout(getProxyUrl(url));
        const res = await response.json();
        const originalUrl = res.data?.songinfo?.pic;
        if (originalUrl) {
          const secureUrl = originalUrl.replace(/^http:/i, "https:");
          if (secureUrl.includes("starheads/")) return secureUrl.replace(/starheads\/\d+/, "starheads/800");
          if (secureUrl.includes("albumcover/")) return secureUrl.replace(/albumcover\/\d+/, "albumcover/800");
          return secureUrl;
        }
        return null;
      } catch(e) { return null; }
    }

    // ========== 渲染 ==========
    function pickRandomKeyword() {
      // 随机歌单名：从词库取一个词，排除最近用过的词，保证每次随机歌单名不同
      for (let attempt = 0; attempt < 20; attempt++) {
        const kw = RANDOM_KEYWORDS[Math.floor(Math.random() * RANDOM_KEYWORDS.length)];
        if (!recentRandomKeywords.includes(kw)) {
          recentRandomKeywords.push(kw);
          if (recentRandomKeywords.length > 12) recentRandomKeywords.shift();
          return kw;
        }
      }
      const fallback = RANDOM_KEYWORDS[Math.floor(Math.random() * RANDOM_KEYWORDS.length)];
      recentRandomKeywords.push(fallback);
      if (recentRandomKeywords.length > 12) recentRandomKeywords.shift();
      return fallback;
    }

    async function loadRanking(bangKey) {
      rankToken++;
      currentMode = 'rank';
      currentBangKey = bangKey;
      const cfg = BANG_CONFIG[bangKey];

      // 命中缓存：直接秒出，跳过网络匹配（整单洗牌随机播放，每次打开顺序不同）
      const cached = loadRankCache(bangKey);
      if (cached) {
        playlist = shuffleArray([...cached.songs]);
        pageIndicator.innerText = `共 ${playlist.length} 首（缓存）`;
        renderPlaylist();
        playSong(0);
        prefetchNextBang(bangKey); // 后台预取另一榜单，切榜零等待
        return;
      }
      prefetchNextBang(bangKey);
      musicList.innerHTML = `<div class="text-center text-slate-400 py-12 text-xs">⏳ 正在加载${cfg.name}...</div>`;
      try {
        rankTracks = bangKey === 'new' && prefetchedNew ? prefetchedNew : (bangKey === 'hot' && prefetchedHot ? prefetchedHot : await fetchRankingTracks(bangKey));

          return;
        }
        pageIndicator.innerText = `共 ${rankTracks.length} 首`;
        rankTracks = shuffleArray(rankTracks); // 整单洗牌后匹配，首批开播即为随机歌曲
        await loadRankingAll();
      } catch (err) {
        console.error(err);
        musicList.innerHTML = `<div class="text-center text-red-400 py-8 px-4 text-xs">${cfg.name}加载失败，请检查代理</div>`;

    // 榜单歌曲行 HTML（供流式追加渲染，列表用 120 缩略图）
    function rankRowHtml(song, idx) {
      const isActive = currentIndex === idx;
      return `
        <div data-index="${idx}" class="flex items-center justify-between p-2.5 cursor-pointer transition ${isActive ? 'bg-brand-600/15 border-l-4 border-brand-500' : 'hover:bg-slate-800/40'}">
          <div class="flex items-center space-x-2.5 min-w-0 flex-1">
            <img src="${song.thumb || song.artwork || DEFAULT_COVER}" loading="lazy" decoding="async" class="w-8 h-8 rounded object-cover bg-slate-800 shrink-0">
            <div class="min-w-0 flex-1">
              <p class="text-xs font-semibold truncate ${isActive ? 'text-brand-400' : 'text-slate-100'}">${song.title}</p>
              <p class="text-[10px] text-slate-400 truncate">${song.artist} - ${song.album || '未知专辑'}</p>
            </div>
          </div>
          <span class="text-[10px] text-slate-500 shrink-0 ml-2">点击播放</span>
        </div>
      `;
    }

    // 数组洗牌（Fisher-Yates）：榜单整单随机排序，实现打开即随机播放
    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 后台预取另一榜单的网易歌单（切榜时直接进入匹配，省一次网络等待）
    function prefetchNextBang(current) {
      if (current === 'hot') {
        if (prefetchedNew || loadRankCache('new')) return; // 另一榜已有缓存，无需预取
        fetchRankingTracks('new').then(t => { prefetchedNew = t; }).catch(() => {});
      } else if (current === 'new') {
        if (prefetchedHot || loadRankCache('hot')) return; // 另一榜已有缓存，无需预取
        fetchRankingTracks('hot').then(t => { prefetchedHot = t; }).catch(() => {});
      }
    }

    // 默认全量加载榜单：边匹配边渲染（流式），自动加载全部歌曲，不做数量限制
    async function loadRankingAll() {
      if (rankLoading) return;
      rankLoading = true;
      const token = rankToken;
      const all = rankTracks;
      try {
        musicList.innerHTML = `<div class="text-center text-slate-400 py-12 text-xs">🎯 正在匹配${BANG_CONFIG[currentBangKey].name}（0 / ${all.length}），请稍候...</div>`;
        playlist = [];
        let offset = 0;
        while (offset < all.length) {
          if (token !== rankToken) return;
          const batch = all.slice(offset, offset + 15);
          const songs = await mapLimit(batch, 15, async t => {
            const first = await findKuwoSong(t.name, t.artist);
            if (first) return first;
            return await findKuwoSong(t.name, t.artist); // 匹配失败重试一次
          });
          if (token !== rankToken) return; // 榜单已切换/已搜索，丢弃本次结果
          const hits = songs.filter(Boolean);
          if (hits.length) {
            const startIdx = playlist.length;
            playlist = playlist.concat(hits);
            if (startIdx === 0) {
              musicList.innerHTML = hits.map(rankRowHtml).join('');
              // 首批匹配完成立即开播，剩余歌曲后台继续流式追加
              playSong(0);
            } else {
              musicList.insertAdjacentHTML('beforeend', hits.map((s, i) => rankRowHtml(s, startIdx + i)).join(''));
            }
          }
          offset += batch.length;
          pageIndicator.innerText = `已匹配 ${offset} / ${all.length}`;
        }
        if (playlist.length) {
          pageIndicator.innerText = `共 ${playlist.length} 首`;
          saveRankCache(currentBangKey, playlist); // 匹配完成立即写缓存，下次秒出
        } else {
          musicList.innerHTML = '<div class="text-center text-slate-500 py-12 text-xs">榜单歌曲匹配失败 😭</div>';
        }
      } catch (err) {
        console.error(err);
        if (playlist.length === 0) {
          musicList.innerHTML = `<div class="text-center text-red-400 py-8 px-4 text-xs">${BANG_CONFIG[currentBangKey].name}加载失败，请检查代理</div>`;
        }
      } finally {
        rankLoading = false;
      }
    }

    function renderPlaylist() {
      musicList.innerHTML = playlist.map((song, idx) => {
        const isActive = currentIndex === idx;
        return `
          <div data-index="${idx}" class="flex items-center justify-between p-2.5 cursor-pointer transition ${isActive ? 'bg-brand-600/15 border-l-4 border-brand-500' : 'hover:bg-slate-800/40'}">
            <div class="flex items-center space-x-2.5 min-w-0 flex-1">
              <img src="${song.thumb || song.artwork || DEFAULT_COVER}" loading="lazy" decoding="async" class="w-8 h-8 rounded object-cover bg-slate-800 shrink-0">
              <div class="min-w-0 flex-1">
                <p class="text-xs font-semibold truncate ${isActive ? 'text-brand-400' : 'text-slate-100'}">${song.title}</p>
                <p class="text-[10px] text-slate-400 truncate">${song.artist} - ${song.album || '未知专辑'}</p>
              </div>
            </div>
            <span class="text-[10px] text-slate-500 shrink-0 ml-2">点击播放</span>
          </div>
        `;
      }).join('');
    }

    function renderLyrics() {
      const emptyHtml = '<div class="text-center text-slate-600 py-8 text-xs">暂无歌词</div>';
      if (!lyrics || lyrics.length === 0) {
        if (lyricsContainer) lyricsContainer.innerHTML = emptyHtml;
        if (lyricPageContainer) lyricPageContainer.innerHTML = emptyHtml;
        return;
      }
      const rows = lyrics.map((line, idx) => `
        <div id="lyric-line-${idx}" data-time="${line.time}" class="lyric-line py-1 px-1.5 text-center text-xs md:text-sm text-slate-500 font-medium transition-all duration-200 cursor-pointer hover:text-white rounded">
          ${line.text}
        </div>
      `).join('');
      if (lyricsContainer) lyricsContainer.innerHTML = rows;
      if (lyricPageContainer) lyricPageContainer.innerHTML = rows;
    }

    // 歌词高亮：同时作用于侧栏与全屏歌词页（滚动居中）
    function applyLyricHighlight(activeIdx) {
      const targets = [
        {
          c: lyricsContainer,
          hi: 'lyric-line py-2 px-1.5 text-center text-sm md:text-base text-brand-400 font-extrabold transition-all duration-300 transform scale-105',
          idle: 'lyric-line py-1 px-1.5 text-center text-xs md:text-sm text-slate-500 font-medium transition-all duration-200 cursor-pointer hover:text-white rounded'
        },
        {
          c: lyricPageContainer,
          hi: 'lyric-line py-2.5 px-1.5 text-center text-base md:text-2xl text-brand-400 font-extrabold transition-all duration-300 transform scale-105',
          idle: 'lyric-line py-1.5 px-1.5 text-center text-sm md:text-base text-slate-500 font-medium transition-all duration-200 cursor-pointer hover:text-white rounded'
        }
      ];
      targets.forEach(({ c, hi, idle }) => {
        if (!c) return;
        const rows = c.querySelectorAll('.lyric-line');
        rows.forEach((el, idx) => { el.className = idx === activeIdx ? hi : idle; });
        const el = rows[activeIdx];
        if (el) {
          const ch = c.clientHeight, eh = el.clientHeight;
          c.scrollTo({ top: el.offsetTop - ch / 2 + eh / 2, behavior: 'smooth' });
        }
      });
    }

    // ========== 全屏歌词页 ==========
    function openLyricPage() {
      if (currentIndex === -1 || !playlist[currentIndex]) return;
      const song = playlist[currentIndex];
      lyricPageTitle.innerText = song.title || '未知歌曲';
      lyricPageArtist.innerText = song.artist || '未知歌手';
      const cover = song.artwork || song.thumb || DEFAULT_COVER;
      lyricPageCover.src = cover;
      lyricPageBg.style.backgroundImage = `url(${cover})`;
      lyricPage.classList.remove('hidden');
      if (currentIndex >= 0) applyLyricHighlight(lastActiveIdx < 0 ? 0 : lastActiveIdx);
      updatePlayButtonState(!audioPlayer.paused);
    }

    function closeLyricPage() {
      lyricPage.classList.add('hidden');
    }

    // ========== 播放 ==========
    // 有声自动播放被浏览器拦截时：自动降级为"静音自动播放"（浏览器允许 muted 自动播放），
    // 音乐立即开始（无声音），等用户第一次真实交互（任意位置）自动开启声音，进度不打断。
    function armSoundUnlock() {
      if (unlockArmed) return;
      unlockArmed = true;
      const unlock = () => {
        document.removeEventListener('pointerdown', unlock);
        document.removeEventListener('keydown', unlock);
        document.removeEventListener('touchend', unlock);
        unlockArmed = false;
        if (!autoplayMuted) return;
        autoplayMuted = false;
        audioPlayer.muted = false;
        try { if (audioPlayer.paused) { const p = audioPlayer.play(); if (p && typeof p.then === 'function') p.then(() => updatePlayButtonState(true)).catch(() => {}); } } catch(e) {}
        miniLyricText.innerText = '🔊 声音已开启';
        updatePlayButtonState(true);
        setTimeout(() => { if (miniLyricText.innerText === '🔊 声音已开启') miniLyricText.innerText = '♪ 歌词加载中...'; }, 1600);
      };
      document.addEventListener('pointerdown', unlock);
      document.addEventListener('keydown', unlock);
      document.addEventListener('touchend', unlock);
    }

    async function playSong(idx, openLyric = false) {
      if (idx < 0 || idx >= playlist.length) return;
      currentIndex = idx;
      const song = playlist[currentIndex];
      renderPlaylist();

      playerTitle.innerText = song.title;
      playerArtist.innerText = song.artist;
      playerCover.src = song.artwork || DEFAULT_COVER;
      playerCover.onerror = function() { this.src = DEFAULT_COVER; };

      // 歌词页已打开时切歌保持打开；点击播放不再自动弹出
      if (!lyricPage.classList.contains('hidden')) openLyricPage();

      const QUALITY_MAP = { 'mp3': 'standard', 'exhigh': 'exhigh', 'flac': 'lossless' };
      const apiLevel = QUALITY_MAP[qualitySelect.value] || 'standard';
      qualityFall = 0; // 每首重置：允许无损→高品质→标准逐级降档
      // 播放 URL 用纯数字 ID
      const playUrl = `https://music.nxinxz.com/kw.php?id=${encodeURIComponent(song.id)}&level=${apiLevel}&type=mp3`;
      audioPlayer.src = playUrl;
      // 浏览器自动播放策略：页面尚无用户手势时"有声"play() 会被拒绝。
      // 策略：先尝试有声播放；被拒则自动降级为静音播放（muted 自动播放被允许），
      // 音乐立即开始走动，提示"点击任意处开启声音"，首次交互后开声、进度不打断。
      try {
        const playPromise = audioPlayer.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(async err => {
            console.log('有声自动播放被拦截，降级静音自动播放', err);
            audioPlayer.muted = true;
            autoplayMuted = true;
            try { await audioPlayer.play(); } catch(e2) { console.error('静音自动播放也被拦截', e2); }
            miniLyricText.innerText = '🔇 已静音自动播放 · 点击任意处开启声音';
            updatePlayButtonState(true);
            armSoundUnlock();
          });
        }
      } catch(err) {
        audioPlayer.muted = true;
        autoplayMuted = true;
        miniLyricText.innerText = '🔇 已静音自动播放 · 点击任意处开启声音';
        armSoundUnlock();
      }
      updatePlayButtonState(true);

      // 传纯数字 ID
      fetchHighResArtwork(song.id).then(url => { if(url) { song.artwork = url; playerCover.src = url; } });

      // ====== 加载歌词 ======
      lastActiveIdx = -1;
      miniLyricText.innerText = "⏳ 正在加载歌词...";
      lyricsContainer.innerHTML = '<div class="text-center text-slate-500 py-8 text-xs">正在加载歌词...</div>';
      if (lyricPageContainer) lyricPageContainer.innerHTML = '<div class="text-center text-slate-500 py-8 text-xs">正在加载歌词...</div>';
      downloadLrcBtn.classList.add('hidden');
      lyrics = [];

      // 传纯数字 ID
      const rawLyrics = await fetchLyrics(song.id);
      console.log('🎵 歌词解析结果:', rawLyrics);

      if (rawLyrics && rawLyrics.length > 0) {
        lyrics = rawLyrics;
        renderLyrics();
        downloadLrcBtn.classList.remove('hidden');
        miniLyricText.innerText = `🎵 ${song.title} - ${song.artist}`;
        console.log('✅ 歌词加载成功，共', lyrics.length, '行');
      } else {
        lyricsContainer.innerHTML = '<div class="text-center text-slate-600 py-8 text-xs">暂无歌词</div>';
        if (lyricPageContainer) lyricPageContainer.innerHTML = '<div class="text-center text-slate-600 py-8 text-xs">暂无歌词</div>';
        miniLyricText.innerText = "🔇 暂无歌词";
        console.warn('❌ 歌词加载失败');
      }

      // 歌词加载完成后：仅歌词页已打开时保持
      if (!lyricPage.classList.contains('hidden')) openLyricPage();
    }

    function updatePlayButtonState(isPlaying) {
      if (isPlaying) {
        playIcon.innerHTML = `<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />`;
        if (lyricPagePlayIcon) lyricPagePlayIcon.innerHTML = `<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />`;
      } else {
        playIcon.innerHTML = `<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />`;
        if (lyricPagePlayIcon) lyricPagePlayIcon.innerHTML = `<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />`;
      }
    }

    // ========== 下载 ==========
    async function downloadCurrentSong() {
      if (currentIndex === -1) { alert('请先播放一首歌曲'); return; }
      const song = playlist[currentIndex];
      const QUALITY_MAP = { 'mp3': 'standard', 'exhigh': 'exhigh', 'flac': 'lossless' };
      const apiLevel = QUALITY_MAP[qualitySelect.value] || 'standard';
      const playUrl = `https://music.nxinxz.com/kw.php?id=${encodeURIComponent(song.id)}&level=${apiLevel}&type=mp3`;
      const originalHTML = downloadSongBtn.innerHTML;
      downloadSongBtn.innerHTML = `<span class="animate-pulse">⏳</span> 下载中...`;
      downloadSongBtn.disabled = true;
      try {
        const response = await fetch(getProxyUrl(playUrl));
        const blob = await response.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${song.title} - ${song.artist}.${apiLevel === 'lossless' ? 'flac' : 'mp3'}`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch(e) { alert('下载失败'); }
      downloadSongBtn.innerHTML = originalHTML;
      downloadSongBtn.disabled = false;
    }

    function downloadLyrics() {
      if (lyrics.length === 0) { alert('没有歌词可下载'); return; }
      const song = playlist[currentIndex];
      let lrc = `[ti:${song.title}]\n[ar:${song.artist}]\n[al:${song.album || '未知'}]\n`;
      lyrics.forEach(line => {
        const m = Math.floor(line.time / 60).toString().padStart(2, '0');
        const s = Math.floor(line.time % 60).toString().padStart(2, '0');
        const ms = Math.floor((line.time % 1) * 100).toString().padStart(2, '0');
        lrc += `[${m}:${s}.${ms}]${line.text}\n`;
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([lrc], { type: 'text/plain;charset=utf-8' }));
      a.download = `${song.title} - ${song.artist}.lrc`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // ========== 音频事件 ==========
    audioPlayer.ontimeupdate = () => {
      const cur = audioPlayer.currentTime;
      const dur = audioPlayer.duration || 0;
      progressBar.style.width = `${(cur/dur)*100 || 0}%`;
      currentTimeEl.innerText = formatTime(cur);
      durationTimeEl.innerText = formatTime(dur);

      if (lyrics.length > 0) {
        let activeIdx = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (cur >= lyrics[i].time) activeIdx = i;
          else break;
        }
        if (activeIdx === -1) activeIdx = 0;
        if (activeIdx !== lastActiveIdx) {
          lastActiveIdx = activeIdx;
          const line = lyrics[activeIdx];
          miniLyricText.innerText = line.text ? `🎤 ${line.text}` : "🎵 ...";
          applyLyricHighlight(activeIdx);
        }
      }
    };

    audioPlayer.onended = () => {
      if (rankShuffleMode && playlist.length > 1) {
        // 随机连播：从未播曲目随机挑下一首，播完一轮自动重置
        playedIndices.add(currentIndex);
        const unplayed = [];
        for (let i = 0; i < playlist.length; i++) {
          if (!playedIndices.has(i) && i !== currentIndex) unplayed.push(i);
        }
        if (!unplayed.length) {
          playedIndices.clear();
          for (let i = 0; i < playlist.length; i++) {
            if (i !== currentIndex) unplayed.push(i);
          }
        }
        const next = unplayed[Math.floor(Math.random() * unplayed.length)];
        playSong(next);
      } else {
        if (currentIndex < playlist.length - 1) playSong(currentIndex + 1);
        else playSong(0);
      }
    };

    // 音质逐级降档：无损→高品质→标准（个别歌曲无更高音质源时自动兼容）
    audioPlayer.onerror = () => {
      if (currentIndex === -1) return;
      const LADDER = ['flac', 'exhigh', 'mp3']; // option value 档位顺序：无损→高品质→标准
      const pos = LADDER.indexOf(qualitySelect.value);
      if (pos >= 0 && pos < LADDER.length - 1 && qualityFall < 2) {
        qualityFall++;
        const t = audioPlayer.currentTime || 0;
        qualitySelect.value = LADDER[pos + 1];
        playSong(currentIndex).then(() => { try { audioPlayer.currentTime = t; } catch (e) {} });
      }
    };

    // ========== 事件绑定 ==========
    randomBtn.onclick = triggerRandomPlay;
    searchInput.onkeypress = e => { if(e.key === 'Enter') { const q = searchInput.value.trim(); q ? playRandomSearch(q) : triggerRandomPlay(); } };
    miniLyricBar.onclick = openLyricPage;
    rankHotBtn.onclick = () => loadRanking('hot');
    rankNewBtn.onclick = () => loadRanking('new');
    musicList.addEventListener('click', e => {
      const row = e.target.closest('[data-index]');
      if (row) playSong(parseInt(row.dataset.index, 10));
    });
    prevPageBtn.onclick = async () => { if(currentPage > 1) { currentPage--; await loadSearchList(); } };
    nextPageBtn.onclick = async () => { currentPage++; await loadSearchList(); };
    playBtn.onclick = () => {
      if (audioPlayer.src) {
        if (autoplayMuted) { autoplayMuted = false; audioPlayer.muted = false; } // 点击播放按钮即开声
        if (audioPlayer.paused) { audioPlayer.play(); updatePlayButtonState(true); }
        else { audioPlayer.pause(); updatePlayButtonState(false); }
      }
    };
    prevBtn.onclick = () => { if(playlist.length) playSong(currentIndex > 0 ? currentIndex - 1 : playlist.length - 1); };
    nextBtn.onclick = () => { if(playlist.length) playSong(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0); };
    progressContainer.onclick = e => {
      if (!audioPlayer.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      audioPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * audioPlayer.duration;
    };
    lyricsContainer.onclick = e => {
      const line = e.target.closest('.lyric-line');
      if (line) { const t = parseFloat(line.dataset.time); if(!isNaN(t)) audioPlayer.currentTime = t; }
    };
    // 全屏歌词页控制
    lyricPageClose.onclick = closeLyricPage;
    lyricPagePlay.onclick = () => {
      if (audioPlayer.src) {
        if (autoplayMuted) { autoplayMuted = false; audioPlayer.muted = false; } // 点击播放按钮即开声
        if (audioPlayer.paused) { audioPlayer.play(); updatePlayButtonState(true); }
        else { audioPlayer.pause(); updatePlayButtonState(false); }
      }
    };
    lyricPagePrev.onclick = () => { if (playlist.length) { playSong(currentIndex > 0 ? currentIndex - 1 : playlist.length - 1); openLyricPage(); } };
    lyricPageNext.onclick = () => { if (playlist.length) { playSong(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0); openLyricPage(); } };
    lyricPageContainer.onclick = e => {
      const line = e.target.closest('.lyric-line');
      if (line) { const t = parseFloat(line.dataset.time); if(!isNaN(t)) audioPlayer.currentTime = t; }
    };
    qualitySelect.onchange = () => { if(currentIndex !== -1) { const t = audioPlayer.currentTime; playSong(currentIndex).then(() => audioPlayer.currentTime = t); } };
    downloadSongBtn.onclick = downloadCurrentSong;
    downloadLrcBtn.onclick = downloadLyrics;

    settingsBtn.onclick = () => { proxyInput.value = localStorage.getItem('music_cors_proxy') || 'https://jsnzkpg4.pages.dev/'; settingsModal.classList.remove('hidden'); };
    closeSettingsBtn.onclick = () => settingsModal.classList.add('hidden');
    saveProxyBtn.onclick = () => {
      const v = proxyInput.value.trim();
      if (v) localStorage.setItem('music_cors_proxy', v);
      else localStorage.removeItem('music_cors_proxy');
      settingsModal.classList.add('hidden');
      window.location.reload();
    };

    // ========== 初始化 ==========
    initTheme();
    qualitySelect.value = 'flac'; // 音质默认自动选择无损（接口无无损源时自动降级标准）
    playerCover.src = DEFAULT_COVER;
    playerCover.onerror = function() { this.src = DEFAULT_COVER; };

    // 打开页面随机选榜：热歌榜/新歌榜二选一，整单洗牌后随机连播
    loadRanking(Math.random() < 0.5 ? 'hot' : 'new');

    console.log('🎵 拾光音乐网已加载');
  </script>
</body>
</html>
